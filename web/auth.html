<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambiar contraseña — Enreda</title>
<style>
  :root { --teal900:#054D5E; --teal400:#18C5C1; --yellow:#FFCB77; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:'Outfit',system-ui,-apple-system,sans-serif; background:#FAFAFA; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { position:relative; width:min(92vw,1000px); aspect-ratio:1000/575; background:var(--teal900); border-radius:5px; box-shadow:0 0 10px 4px rgba(0,0,0,.25); overflow:hidden; display:grid; grid-template-columns:52% 48%; }
  .photo { position:relative; z-index:0; background:url("./auth-photo.png") center/cover no-repeat; height:100%; }
  .panel { position:relative; z-index:1; background:var(--teal900); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4% 6%; }
  .vector { position:absolute; top:-2%; left:-2%; width:104%; z-index:3; pointer-events:none; }
  .vector img { width:100%; height:auto; display:block; }
  .logo { position:absolute; top:6%; right:8%; height:13%; min-height:34px; z-index:4; }
  .logo img { height:100%; width:auto; display:block; }
  .content { position:relative; z-index:2; width:100%; max-width:380px; display:none; flex-direction:column; align-items:center; text-align:center; }
  .content.on { display:flex; }
  h1 { color:#fff; font-weight:700; font-size:clamp(20px,2.2vw,30px); margin:0 0 clamp(12px,2.2vh,24px); }
  .sub { color:#fff; opacity:.92; font-size:13px; line-height:1.5; margin:0 0 16px; }
  .field { position:relative; width:100%; margin-bottom:12px; text-align:left; }
  .field input { width:100%; background:transparent; border:1.5px solid #fff; border-radius:12px; padding:13px 44px 13px 18px; font:inherit; font-size:14px; color:#fff; outline:none; }
  .field input::placeholder { color:#fff; opacity:.92; }
  .field input:focus { border-color:var(--yellow); }
  .field .eye { position:absolute; right:16px; top:50%; transform:translateY(-50%); width:20px; height:20px; color:#fff; cursor:pointer; }
  .error { color:#fff; background:rgba(232,22,22,.9); border-radius:10px; padding:9px 12px; font-size:12px; width:100%; margin-bottom:10px; display:none; text-align:left; }
  .submit { margin-top:clamp(12px,2.5vh,22px); background:var(--teal400); color:#fff; border:none; border-radius:30px; padding:13px 56px; font:inherit; font-weight:600; font-size:15px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.25); }
  .submit:disabled { opacity:.6; cursor:default; }
  .footer { margin-top:14px; color:#fff; font-size:12px; }
  .ok { width:54px; height:54px; border-radius:50%; background:var(--teal400); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .bad { width:54px; height:54px; border-radius:50%; border:3px solid var(--yellow); display:flex; align-items:center; justify-content:center; margin-bottom:16px; color:var(--yellow); font-size:28px; font-weight:700; }
  .link { display:inline-block; margin-top:14px; color:var(--yellow); font-weight:600; text-decoration:none; font-size:14px; }
  .spinner { width:40px; height:40px; border:4px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:680px){ .card{ grid-template-columns:1fr; aspect-ratio:auto; min-height:78vh; } .photo{ display:none; } .logo{ top:24px; right:6%; height:auto; } .logo img{ height:34px; } .vector{ top:-2%; width:120%; left:-10%; } .panel{ padding:72px 22px 32px; } }
</style>
</head>
<body>
  <div class="card">
    <div class="photo"></div>
    <div class="panel">
      <div class="content" id="view-loading">
        <div class="spinner"></div><h1>Un momento…</h1><p class="sub">Validando tu enlace.</p>
      </div>
      <form class="content" id="view-form" onsubmit="return onSubmit(event)">
        <h1>Cambiar contraseña</h1>
        <div class="error" id="form-error"></div>
        <div class="field"><input id="p1" type="password" placeholder="Contraseña nueva" autocomplete="new-password">
          <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" onclick="toggle('p1')"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <div class="field"><input id="p2" type="password" placeholder="Repetir contraseña" autocomplete="new-password">
          <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" onclick="toggle('p2')"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <button class="submit" id="submitBtn" type="submit">Guardar</button>
        <div class="footer">Enreda es mejor desde nuestra App</div>
      </form>
      <div class="content" id="view-ok">
        <div class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
        <h1 id="ok-title">Contraseña cambiada</h1><p class="sub" id="ok-text">Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <a class="link" id="ok-link" href="#" style="display:none">Ir a Enreda</a>
      </div>
      <div class="content" id="view-bad">
        <div class="bad">!</div><h1 id="bad-title">Enlace caducado</h1>
        <p class="sub" id="bad-text">Este enlace ya no es válido. Solicita un nuevo correo de cambio de contraseña.</p>
      </div>
    </div>

<script>
  var API="https://identitytoolkit.googleapis.com/v1/accounts";
  var FALLBACK_KEY="AIzaSyDtKT5Dd-NOko6DCWgDFl6NqfJPCE8_4XQ";
  function qp(n){ return new URLSearchParams(location.search).get(n); }
  var mode=qp("mode"), oobCode=qp("oobCode"), apiKey=qp("apiKey")||FALLBACK_KEY, continueUrl=qp("continueUrl");
  function show(id){ ["view-loading","view-form","view-ok","view-bad"].forEach(function(v){ document.getElementById(v).classList.toggle("on", v===id); }); }
  function toggle(id){ var i=document.getElementById(id); i.type=i.type==="password"?"text":"password"; }
  function formError(m){ var e=document.getElementById("form-error"); e.textContent=m; e.style.display="block"; }
  function ok(t,x){ document.getElementById("ok-title").textContent=t; document.getElementById("ok-text").textContent=x; if(continueUrl){ var l=document.getElementById("ok-link"); l.href=continueUrl; l.style.display="inline-block"; } show("view-ok"); }
  function bad(t,x){ document.getElementById("bad-title").textContent=t; document.getElementById("bad-text").textContent=x; show("view-bad"); }
  function post(action,body){ return fetch(API+":"+action+"?key="+encodeURIComponent(apiKey),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,body:j}; }); }); }
  show("view-loading");
  if(!oobCode){ bad("Enlace no válido","Falta el código de acción. Solicita un nuevo correo."); }
  else if(mode==="resetPassword"){ post("resetPassword",{oobCode:oobCode}).then(function(r){ r.ok?show("view-form"):bad("Enlace caducado","Este enlace ya no es válido. Solicita un nuevo correo de cambio de contraseña."); }).catch(function(){ bad("Error","No se pudo validar el enlace."); }); }
  else if(mode==="verifyEmail"){ post("update",{oobCode:oobCode}).then(function(r){ r.ok?ok("Correo verificado","Tu dirección de correo ha sido verificada correctamente."):bad("Enlace caducado","Este enlace de verificación ya no es válido."); }).catch(function(){ bad("Error","No se pudo completar la verificación."); }); }
  else if(mode==="recoverEmail"){ post("update",{oobCode:oobCode}).then(function(r){ r.ok?ok("Correo restaurado","Se ha restaurado tu dirección de correo anterior."):bad("Enlace caducado","Este enlace ya no es válido."); }).catch(function(){ bad("Error","No se pudo completar la acción."); }); }
  else { bad("Acción no soportada","Este enlace no se reconoce."); }
  function onSubmit(e){ e.preventDefault();
    var p1=document.getElementById("p1").value, p2=document.getElementById("p2").value;
    document.getElementById("form-error").style.display="none";
    if(p1.length<6){ formError("La contraseña debe tener al menos 6 caracteres."); return false; }
    if(p1!==p2){ formError("Las contraseñas no coinciden."); return false; }
    var b=document.getElementById("submitBtn"); b.disabled=true; b.textContent="Guardando…";
    post("resetPassword",{oobCode:oobCode,newPassword:p1}).then(function(r){
      if(r.ok){ ok("Contraseña cambiada","Ya puedes iniciar sesión con tu nueva contraseña."); }
      else { b.disabled=false; b.textContent="Guardar"; var c=r.body&&r.body.error&&r.body.error.message;
        formError(c==="EXPIRED_OOB_CODE"?"El enlace ha caducado. Solicita uno nuevo.":c==="WEAK_PASSWORD"?"La contraseña es demasiado débil.":"No se pudo cambiar la contraseña. Inténtalo de nuevo."); }
    }).catch(function(){ b.disabled=false; b.textContent="Guardar"; formError("Error de red. Inténtalo de nuevo."); });
    return false;
  }
</script>
